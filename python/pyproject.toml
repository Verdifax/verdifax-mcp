[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verdifax-mcp"
version = "0.1.0"
description = "The Verdifax MCP server: lets AI assistants read Verdifax records, check them with the local verifier, and seal decisions through the customer's policy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Verdifax", email = "team@verdifax.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX",
    "Topic :: Security :: Cryptography",
]
# The official MCP SDK and the Verdifax SDK, at the exact versions the tests ran on.
dependencies = [
    "mcp==2.3.0",
    "verdifax[signing]==1.17.0",
    "httpx>=0.28,<1",
    "jsonschema>=4.20,<5",
    "anyio>=4.9,<5",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
verdifax-mcp = "verdifax_mcp.main:main"

[project.urls]
Homepage = "https://verdifax.com"
Source = "https://github.com/Verdifax/verdifax-mcp"

[tool.setuptools]
packages = ["verdifax_mcp"]

[tool.setuptools.package-data]
verdifax_mcp = ["mcp-tools.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
